plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def stableSigningPath = System.getenv('NEON_BREACH_KEYSTORE_PATH')

android {
    signingConfigs {
        stableDebug {
            if (stableSigningPath != null && !stableSigningPath.isBlank()) {
                storeFile file(stableSigningPath)
                storePassword System.getenv('NEON_BREACH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEON_BREACH_KEY_ALIAS')
                keyPassword System.getenv('NEON_BREACH_KEY_PASSWORD')
            }
        }
    }

    namespace 'com.duckdream.neonbreach'
    compileSdk 35
    defaultConfig {
        applicationId 'com.duckdream.neonbreach'
        minSdk 23
        targetSdk 35
        versionCode 20
        versionName '0.5'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        debug {
            // If the private GitHub Actions secrets are configured, reuse the same signing
            // key between CI runs so Android can install updates over the previous version.
            if (stableSigningPath != null && !stableSigningPath.isBlank()) {
                signingConfig signingConfigs.stableDebug
            }
        }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
