plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duckdream.neonbreach'
    compileSdk 37

    defaultConfig {
        applicationId 'com.duckdream.neonbreach'
        minSdk 23
        targetSdk 35
        versionCode 31
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -Wall -Wextra -Werror' }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.77.3'
    implementation 'com.google.android.filament:gltfio-android:1.77.3'
    implementation 'com.google.android.filament:filament-utils-android:1.77.3'
}
