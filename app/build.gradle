plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.duckdream.neonbreach'
    compileSdk 35
    defaultConfig {
        applicationId 'com.duckdream.neonbreach'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName '0.6.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
