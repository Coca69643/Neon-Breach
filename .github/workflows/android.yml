name: Build Project Arena APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Verify and compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: true
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          # SDK Manager publishes API 37 as android-37.0 while AGP's compileSdk
          # resolver looks for android-37. Keep both names pointed at the same platform.
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Verify project structure
        run: python3 tools/verify_project.py
      - name: Compile Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: project-arena-0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
