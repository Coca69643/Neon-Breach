name: Build Project Arena APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, rebuild/team-objective-moba-v0.1]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, rebuild/team-objective-moba-v0.1, rework/project-arena-0.8-camera-map-combat, rebuild/project-arena-0.9-siege-core, rebuild/project-arena-0.9.1-menu-audit]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Verify and compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: true
      - name: Prepare persistent APK signing key
        if: github.event_name != 'pull_request'
        env:
          NEON_BREACH_KEYSTORE_BASE64: ${{ secrets.NEON_BREACH_KEYSTORE_BASE64 }}
          NEON_BREACH_KEYSTORE_PASSWORD: ${{ secrets.NEON_BREACH_KEYSTORE_PASSWORD }}
          NEON_BREACH_KEY_ALIAS: ${{ secrets.NEON_BREACH_KEY_ALIAS }}
          NEON_BREACH_KEY_PASSWORD: ${{ secrets.NEON_BREACH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${NEON_BREACH_KEYSTORE_BASE64:-}" || { echo "::error::Persistent signing secret is missing; refusing to publish an update APK."; exit 1; }
          test -n "${NEON_BREACH_KEYSTORE_PASSWORD:-}"
          test -n "${NEON_BREACH_KEY_ALIAS:-}"
          test -n "${NEON_BREACH_KEY_PASSWORD:-}"
          KEYSTORE_PATH="$RUNNER_TEMP/project-arena-signing.jks"
          printf '%s' "$NEON_BREACH_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "NEON_BREACH_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "NEON_BREACH_KEYSTORE_PASSWORD=$NEON_BREACH_KEYSTORE_PASSWORD"
            echo "NEON_BREACH_KEY_ALIAS=$NEON_BREACH_KEY_ALIAS"
            echo "NEON_BREACH_KEY_PASSWORD=$NEON_BREACH_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent signing key loaded."
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Verify project structure
        run: python3 tools/verify_project.py
      - name: Run native gameplay regression tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -Itests/native tests/native/native_sim_tests.cpp -o "$RUNNER_TEMP/project-arena-native-tests"
          "$RUNNER_TEMP/project-arena-native-tests"
      - name: Compile Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify package, version and APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.duckdream.neonbreach' versionCode='40' versionName='0.9.1'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Run packaged APK smoke tests
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed update APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: project-arena-0.9.1-update
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
