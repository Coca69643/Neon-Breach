name: Build Project Arena APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, rebuild/team-objective-moba-v0.1, rebuild/project-arena-0.10.0-hub, rebuild/project-arena-0.12.0-full-moba, rebuild/project-arena-0.13.0-battleground, rebuild/project-arena-0.14.0-physical-heroes, rebuild/project-arena-0.15.0-visual-overhaul]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - 'tests/**'
      - 'world/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, rebuild/team-objective-moba-v0.1, rebuild/project-arena-0.10.0-hub, rework/project-arena-0.8-camera-map-combat, rebuild/project-arena-0.9-siege-core, rebuild/project-arena-0.9.1-humanized, rebuild/project-arena-0.12.0-character-motion, rebuild/project-arena-0.12.0-full-moba, rebuild/project-arena-0.13.0-battleground, rebuild/project-arena-0.14.0-physical-heroes, rebuild/project-arena-0.15.0-visual-overhaul, project-arena/rebuild-from-0.15.0, rebuild/project-arena-1.7.0-world-foundation]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    name: Verify and compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: true
      - name: Prepare persistent APK signing key
        if: github.event_name != 'pull_request'
        env:
          NEON_BREACH_KEYSTORE_BASE64: ${{ secrets.NEON_BREACH_KEYSTORE_BASE64 }}
          NEON_BREACH_KEYSTORE_PASSWORD: ${{ secrets.NEON_BREACH_KEYSTORE_PASSWORD }}
          NEON_BREACH_KEY_ALIAS: ${{ secrets.NEON_BREACH_KEY_ALIAS }}
          NEON_BREACH_KEY_PASSWORD: ${{ secrets.NEON_BREACH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${NEON_BREACH_KEYSTORE_BASE64:-}" || { echo "::error::Persistent signing secret is missing; refusing to publish an update APK."; exit 1; }
          test -n "${NEON_BREACH_KEYSTORE_PASSWORD:-}"
          test -n "${NEON_BREACH_KEY_ALIAS:-}"
          test -n "${NEON_BREACH_KEY_PASSWORD:-}"
          KEYSTORE_PATH="$RUNNER_TEMP/project-arena-signing.jks"
          printf '%s' "$NEON_BREACH_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "NEON_BREACH_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "NEON_BREACH_KEYSTORE_PASSWORD=$NEON_BREACH_KEYSTORE_PASSWORD"
            echo "NEON_BREACH_KEY_ALIAS=$NEON_BREACH_KEY_ALIAS"
            echo "NEON_BREACH_KEY_PASSWORD=$NEON_BREACH_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent signing key loaded."
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn android-37.0 "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/platforms/android-37"
      - name: Validate Python asset pipeline syntax
        run: python3 -m py_compile tools/fetch_cc0_life_assets.py tools/fetch_cc0_nature_assets.py tools/generate_terrain_materials.py tools/verify_project.py tools/verify_arena_world.py
      - name: Fetch and verify pinned CC0 life assets
        run: python3 tools/fetch_cc0_life_assets.py
      - name: Bake pinned CC0 nature assets into static GLBs
        run: python3 tools/fetch_cc0_nature_assets.py
      - name: Generate tileable PBR terrain materials
        run: python3 tools/generate_terrain_materials.py
      - name: Validate canonical Arena 1.7.0 world
        run: python3 tools/verify_arena_world.py
      - name: Compile and run native physics tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            app/src/main/cpp/ArenaPhysics.cpp tests/arena_physics_tests.cpp \
            -o "$RUNNER_TEMP/arena_physics_tests"
          "$RUNNER_TEMP/arena_physics_tests"
      - name: Verify project structure
        run: python3 tools/verify_project.py
      - name: Test generated hero gear GLB variants
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify package, version and APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.duckdream.projectarena' versionCode='59' versionName='0.16.0'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Prepare versioned APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Project-Arena-0.16.0.apk
          sha256sum Project-Arena-0.16.0.apk > Project-Arena-0.16.0.apk.sha256
      - name: Upload signed update APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: project-arena-0.16.0-update
          path: |
            Project-Arena-0.16.0.apk
            Project-Arena-0.16.0.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish Project Arena 0.16.0 tester release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-arena-0.16.0
          target_commitish: ${{ github.sha }}
          name: Projeto Arena 0.16.0 — build de teste
          body: |
            Projeto Arena 0.16.0 para Android — pré-lançamento para testes.
            - Vale das Coroas reconstruído com rio de largura variável, vegetação CC0 e superfícies PBR.
            - Iluminação ambiental refinada com sombras, oclusão de contato e névoa de distância.
            - Lyra, Bastion e Kairo agora fornecem os corpos CC0 do jogador, 9 bots e 48 minions.
            - Bots e minions usam animações Idle/Walk/Run originais, variação de silhuetas e paletas por material.
            - Mantido o funcionamento offline e o applicationId com.duckdream.projectarena.
            versionCode: 59
            Commit: ${{ github.sha }}
            APK compilado, assinado e validado pelo GitHub Actions.
            Teste visual, FPS sustentado e temperatura ainda precisam de validação no aparelho.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Project-Arena-0.16.0.apk
            Project-Arena-0.16.0.apk.sha256
      - name: Publish tester release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rebuild/project-arena-0.15.0-visual-overhaul'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-arena-0.15.0
          name: Project Arena 0.15.0 — identidade visual e relevo
          body: |
            Build 0.15.0: cinco silhuetas de função para bots, correção do eixo anatômico dos braços, locomoção procedural por função, vale/cristas de maior amplitude sincronizados com a física e HUB com arte ilustrada própria e navegação compacta.
            Preserva HUB 0.10.0, animação do herói 0.11.0 e stack nativa Kotlin + C++20 + Filament.
            Pré-lançamento: validar fluxo de partida, leitura do mapa, desempenho e estabilidade em aparelho Android.
          draft: false
          prerelease: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
      - name: Align release tag with verified source commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/rebuild/project-arena-0.15.0-visual-overhaul'
        run: |
          git tag --force project-arena-0.15.0 "$GITHUB_SHA"
          git push --force origin refs/tags/project-arena-0.15.0
