name: Native Renderer POC

on:
  push:
    branches:
      - architecture/native-opengles-poc
    paths:
      - "native-renderer-poc/**"
      - ".github/workflows/native-renderer-poc.yml"
  pull_request:
    branches:
      - main
    paths:
      - "native-renderer-poc/**"
      - ".github/workflows/native-renderer-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-renderer-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-poc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-renderer-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Compile standalone Android POC
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
