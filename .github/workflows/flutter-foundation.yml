name: Flutter Scene Foundation

on:
  push:
    branches:
      - migration/flutter-scene-mobile-v0.1
      - main
      - feat/1.8.3-session-lobby-foundation
    paths:
      - "flutter/**"
      - "app/src/main/assets/world/nature/**"
      - "app/src/main/assets/world/kaykit/**"
      - "app/src/main/assets/characters/quaternius-character.glb.b64"
      - "ASSETS/KayKit-Medieval-Hexagon-LICENSE.txt"
      - "app/src/main/res/drawable/ic_launcher.xml"
      - "tools/generate_terrain_materials.py"
      - ".github/workflows/flutter-foundation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "flutter/**"
      - "app/src/main/assets/world/nature/**"
      - "app/src/main/assets/world/kaykit/**"
      - "app/src/main/assets/characters/quaternius-character.glb.b64"
      - "ASSETS/KayKit-Medieval-Hexagon-LICENSE.txt"
      - "app/src/main/res/drawable/ic_launcher.xml"
      - "tools/generate_terrain_materials.py"
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-arena-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify CI signing and release policy
        run: python3 tool/verify_ci_policy.py
      - name: Install Flutter 3.47 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Set up Python 3.13 for offline asset tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flutter/tool/requirements-world.txt
      - name: Install pinned image conversion tool
        run: python3 -m pip install --disable-pip-version-check --no-input -r tool/requirements-world.txt
      - name: Bake offline urban battlefield terrain and park dressing
        run: python3 tool/prepare_world_assets.py
      - name: Build Lyra, Bastion and distinct male Kairo CC0 GLBs
        run: python3 tool/prepare_hero_assets.py
      - name: Prepare offline CC0 city and interior assets
        run: python3 tool/prepare_city_assets.py
      - name: Prepare pinned CC0 NPC models for bots, minions and city NPCs
        run: python3 tool/prepare_npc_assets.py
      - name: Prepare offline MOBA character and structure assets
        run: python3 tool/prepare_match_assets.py
      - name: Prepare pinned Quaternius CC0 hero weapons
        run: python3 tool/prepare_weapon_assets.py
      - name: Load persistent Project Arena signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEON_BREACH_KEYSTORE_BASE64: ${{ secrets.NEON_BREACH_KEYSTORE_BASE64 }}
          NEON_BREACH_KEYSTORE_PASSWORD: ${{ secrets.NEON_BREACH_KEYSTORE_PASSWORD }}
          NEON_BREACH_KEY_ALIAS: ${{ secrets.NEON_BREACH_KEY_ALIAS }}
          NEON_BREACH_KEY_PASSWORD: ${{ secrets.NEON_BREACH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${NEON_BREACH_KEYSTORE_BASE64:-}" || { echo "::error::Persistent signing secret is missing; refusing to publish an incompatible update APK."; exit 1; }
          test -n "${NEON_BREACH_KEYSTORE_PASSWORD:-}"
          test -n "${NEON_BREACH_KEY_ALIAS:-}"
          test -n "${NEON_BREACH_KEY_PASSWORD:-}"
          KEYSTORE_PATH="$RUNNER_TEMP/project-arena-signing.jks"
          printf '%s' "$NEON_BREACH_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "NEON_BREACH_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "NEON_BREACH_KEYSTORE_PASSWORD=$NEON_BREACH_KEYSTORE_PASSWORD"
            echo "NEON_BREACH_KEY_ALIAS=$NEON_BREACH_KEY_ALIAS"
            echo "NEON_BREACH_KEY_PASSWORD=$NEON_BREACH_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent signing key loaded."
      - name: Generate Android host, identity and Flutter GPU setup
        run: python3 tool/prepare_android.py
      - name: Isolate PR profile application identity
        if: github.event_name == 'pull_request'
        run: python3 tool/prepare_profile_qa_identity.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build ARM64 profile APK for PR runtime validation
        if: github.event_name == 'pull_request'
        run: flutter build apk --profile --target-platform android-arm64
      - name: Inspect profile APK identity, runtime assets and ABI
        if: github.event_name == 'pull_request'
        run: python3 tool/verify_release_apk.py build/app/outputs/flutter-apk/app-profile.apk --qa-profile
      - name: Verify profile APK signature
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-profile.apk
      - name: Prepare profile QA artifact
        if: github.event_name == 'pull_request'
        run: |
          cp build/app/outputs/flutter-apk/app-profile.apk Project-Arena-1.8.1-arm64-profile-qa.apk
          sha256sum Project-Arena-1.8.1-arm64-profile-qa.apk > Project-Arena-1.8.1-arm64-profile-qa.apk.sha256
      - name: Upload profile QA artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: project-arena-1.8.1-arm64-profile-qa
          path: |
            flutter/Project-Arena-1.8.1-arm64-profile-qa.apk
            flutter/Project-Arena-1.8.1-arm64-profile-qa.apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Build ARM64 Android release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK identity, platform and bundled scenes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tool/verify_release_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Prepare versioned APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Project-Arena-1.8.1-arm64.apk
          sha256sum Project-Arena-1.8.1-arm64.apk > Project-Arena-1.8.1-arm64.apk.sha256
      - name: Upload trusted ARM64 update artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: project-arena-1.8.1-arm64
          path: |
            flutter/Project-Arena-1.8.1-arm64.apk
            flutter/Project-Arena-1.8.1-arm64.apk.sha256
            flutter/Project-Arena-1.8.1-Changelog.txt
          if-no-files-found: error
          retention-days: 30


  publish-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: flutter-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: project-arena-1.8.1-arm64
          path: release
      - name: Refuse to overwrite an existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/project-arena-1.8.1" >/dev/null 2>&1; then
            echo "::error::Tag project-arena-1.8.1 already exists; refusing to replace a published build."
            exit 1
          fi
      - name: Publish Projeto Arena 1.8.1 stable tester release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-arena-1.8.1
          target_commitish: ${{ github.sha }}
          name: Projeto Arena 1.8.1 — build de teste
          body: |
            Projeto Arena 1.8.1 para Android ARM64.
            - Aplicativo offline em landscape, compilado para Android ARM64.
            - Seis aparências CC0 independentes dos heróis jogáveis para bots, tropas e NPCs.
            - Animações de locomoção e interação social incluídas nos modelos de NPC.
            - Entradas dos interiores alinhadas com a abertura de colisão.
            - NPCs do distrito incluídos no pacote offline.
            - versionName 1.8.1 / versionCode 74.
            - APK compilado, assets conferidos e assinatura verificada pelo GitHub Actions.
            - Orientação visual, exploração e desempenho sustentado ainda precisam de validação no Realme C53.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: false
          files: |
            release/Project-Arena-1.8.1-arm64.apk
            release/Project-Arena-1.8.1-arm64.apk.sha256
