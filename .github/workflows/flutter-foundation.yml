name: Flutter Foundation

on:
  push:
    branches:
      - migration/flutter-state-machine-v0.1
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --reporter expanded
