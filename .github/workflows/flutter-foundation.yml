name: Flutter Scene Foundation

on:
  push:
    branches:
      - migration/flutter-scene-mobile-v0.1
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter 3.47 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Generate Android host and enable Flutter GPU
        run: python3 tool/prepare_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build Android release
        run: flutter build apk --release --enable-flutter-gpu
