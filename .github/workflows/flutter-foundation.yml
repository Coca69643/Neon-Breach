name: Flutter Scene Foundation

on:
  push:
    branches:
      - migration/flutter-scene-mobile-v0.1
    paths:
      - "flutter/**"
      - "app/src/main/assets/world/nature/**"
      - "tools/generate_terrain_materials.py"
      - ".github/workflows/flutter-foundation.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "app/src/main/assets/world/nature/**"
      - "tools/generate_terrain_materials.py"
      - ".github/workflows/flutter-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter 3.47 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Bake offline organic world assets
        run: python3 tool/prepare_world_assets.py
      - name: Generate Android host and enable Flutter GPU
        run: python3 tool/prepare_android.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build Android release
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-arena-flutter-scene-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
