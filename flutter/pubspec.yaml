name: project_arena_flutter
description: Projeto Arena — MOBA 3D mobile com Flutter Scene.
publish_to: none
version: 1.8.1+74

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  flutter_scene_rapier: 0.5.2
  hooks: ^2.0.0
  vector_math: ^2.1.4
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/arena_manifest.json
    - assets/heroes/
    - assets/weapons/
    - assets/match/
    - assets/npcs/
    - assets/world/
    - assets/world/city/
    - flutter_scene_generated/
