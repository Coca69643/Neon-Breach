name: project_arena_flutter
description: Projeto Arena — MOBA 3D mobile com Flutter Scene.
publish_to: none
version: 1.7.8+70

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  hooks: ^2.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/arena_manifest.json
    - assets/heroes/
    - assets/weapons/
    - assets/match/
    - assets/world/
    - assets/world/city/
    - flutter_scene_generated/
